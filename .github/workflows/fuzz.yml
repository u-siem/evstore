name: Fuzz

# A short libFuzzer run of every target: daily, on demand, and when a pull
# request touches the code that decodes on-disk formats. Crashes are
# uploaded as artifacts; reproduce one with
# `cargo +nightly fuzz run <target> <artifact>`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - "src/codec.rs"
      - "src/wal.rs"
      - "src/segment.rs"
      - "src/index.rs"
      - "src/directory.rs"
      - "src/registry.rs"
      - "src/query.rs"
      - "src/aggregate.rs"
      - "src/fuzz_api.rs"
      - "fuzz/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wal_replay, manifest, segment_footer, segment_block, segment_file]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'pull_request' && '60') || '300' }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -max_len=65536
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
